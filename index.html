<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sean Stayte | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Base styles */
    body {
      margin: 0;
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      display: flex;
      min-height: 100vh;
      background: #fff;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: #333; /* medium charcoal grey */
      color: #fff;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .sidebar img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid #fff;
      margin-bottom: 20px;
    }
    .sidebar h1 {
      margin: 10px 0 5px;
      font-size: 1.6em;
    }
    .sidebar h2 {
      margin: 0 0 15px;
      font-weight: normal;
      font-size: 1.1em;
      color: #ddd;
    }
    .sidebar p {
      text-align: center;
      font-size: 0.95em;
      margin-bottom: 20px;
    }
    .sidebar a {
      color: #fff;
      text-decoration: none;
      margin: 5px 0;
      display: block;
    }
    .sidebar a:hover {
      text-decoration: underline;
    }

    /* Main content */
    .main {
      flex: 1;
      padding: 40px;
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
    }
    .project {
      text-align: center;
    }
    .project img {
      width: 100%;
      aspect-ratio: 1 / 1; /* ensures square thumbnails */
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .project h3 {
      margin-top: 10px;
      font-size: 1em;
      color: #333;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <img src="headshot_pic.png" alt="Sean Stayte">
    <h1>Sean Stayte</h1>
    <h2>Data Analyst</h2>
    <p>
      Passionate about turning data into insights. Experienced in statistical modeling, visualization, and creating actionable dashboards for real-world impact.
    </p>
    <a href="mailto:sean.stayte@example.com">Email</a>
    <a href="https://linkedin.com/in/seanstayte">LinkedIn</a>
    <a href="https://github.com/seanstayte">GitHub</a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h2>Projects</h2>
    <div class="projects-grid">
      <div class="project">
        <a href="https://github.com/seanstayte/solar-dashboard">
          <img src="solar-thumbnail.jpg" alt="Solar Power Dashboard">
          <h3>Solar Power Dashboard</h3>
        </a>
      </div>
      <div class="project">
        <a href="https://github.com/seanstayte/windows11-analysis">
          <img src="windows-thumbnail.jpg" alt="Windows 11 Uptake Analysis">
          <h3>Windows 11 Uptake Analysis</h3>
        </a>
      </div>
      <!-- Add more projects as needed -->
    </div>
  </div>
</body>
</html>
